name: Build Windows Exe Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 and Install Qt6
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg

      - name: Build PhotoColla (C++20 Release)
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package Windows Standalone Application & Resolve All DLLs
        shell: msys2 {0}
        run: |
          mkdir -p package
          cp build/PhotoColla.exe package/
          windeployqt --no-translations --compiler-runtime package/PhotoColla.exe

          # Recursive dependency resolver to copy ALL missing MSYS2 DLLs
          python3 -c "
          import os, subprocess, shutil

          dest = 'package'
          for iteration in range(10):
              new_copied = 0
              for root, dirs, files in os.walk(dest):
                  for file in files:
                      if file.endswith('.exe') or file.endswith('.dll'):
                          filepath = os.path.join(root, file)
                          try:
                              out = subprocess.check_output(['ldd', filepath], text=True, stderr=subprocess.DEVNULL)
                              for line in out.splitlines():
                                  parts = line.strip().split(' => ')
                                  if len(parts) == 2:
                                      dll_name = parts[0].strip()
                                      dll_path = parts[1].split(' ')[0].strip()
                                      if dll_path.startswith('/ucrt64/') and os.path.exists(dll_path):
                                          target = os.path.join(dest, dll_name)
                                          if not os.path.exists(target):
                                              print(f'Copying missing runtime DLL: {dll_name}')
                                              shutil.copy2(dll_path, target)
                                              new_copied += 1
                          except Exception:
                              pass
              if new_copied == 0:
                  print(f'All transitive DLL dependencies resolved successfully in pass {iteration + 1}!')
                  break
          "

      - name: Compress into Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path package/* -DestinationPath PhotoColla-Windows-x64.zip

      - name: Upload Artifact (Zip with Exe)
        uses: actions/upload-artifact@v4
        with:
          name: PhotoColla-Windows-x64
          path: PhotoColla-Windows-x64.zip
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-windows
          name: "PhotoColla v1.0.0 (Windows Standalone Exe)"
          draft: false
          prerelease: false
          files: PhotoColla-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
