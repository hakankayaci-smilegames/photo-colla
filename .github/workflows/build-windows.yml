name: Build Windows Exe Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 and Install Qt6
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg

      - name: Build PhotoColla (C++20 Release)
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package Windows Standalone Application
        shell: msys2 {0}
        run: |
          mkdir -p package
          cp build/PhotoColla.exe package/
          windeployqt --no-translations --compiler-runtime package/PhotoColla.exe
          cp /ucrt64/bin/libgcc_s_seh-1.dll /ucrt64/bin/libstdc++-6.dll /ucrt64/bin/libwinpthread-1.dll package/ 2>/dev/null || true

      - name: Compress into Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path package/* -DestinationPath PhotoColla-Windows-x64.zip

      - name: Upload Artifact (Zip with Exe)
        uses: actions/upload-artifact@v4
        with:
          name: PhotoColla-Windows-x64
          path: PhotoColla-Windows-x64.zip
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-windows
          name: "PhotoColla v1.0.0 (Windows Standalone Exe)"
          draft: false
          prerelease: false
          files: PhotoColla-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
